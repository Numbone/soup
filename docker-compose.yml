# docker compose up                      -> postgres + api (:8080) + 4 workers
# docker compose run --rm chaos [flags]   -> chaos harness (own api + 8 workers as child processes, own DB)
# docker compose run --rm test            -> integration tests for the silent-failure cases

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: soup
      POSTGRES_PASSWORD: soup
      POSTGRES_DB: soup
    ports: ["5432:5432"]
    volumes:
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soup -d soup"]
      interval: 1s
      timeout: 3s
      retries: 30

  api:
    build: .
    command: ["/app/api"]
    environment:
      DATABASE_URL: postgres://soup:soup@postgres:5432/soup
      ADDR: ":8080"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: .
    command: ["/app/worker", "-lease", "3s"]
    environment:
      DATABASE_URL: postgres://soup:soup@postgres:5432/soup
    deploy:
      replicas: 4
    depends_on:
      api: { condition: service_started } # api applies the schema
    restart: unless-stopped

  chaos:
    build: .
    profiles: ["chaos"]
    init: true
    entrypoint: ["/app/chaos", "-api-bin", "/app/api", "-worker-bin", "/app/worker", "-logdir", "/runs/logs"]
    environment:
      DATABASE_URL: postgres://soup:soup@postgres:5432/soup_chaos
    volumes:
      - ./runs:/runs
    depends_on:
      postgres: { condition: service_healthy }

  test:
    image: golang:1.27-alpine
    profiles: ["test"]
    working_dir: /src
    command: ["go", "test", "-count=1", "-v", "./..."]
    environment:
      TEST_DATABASE_URL: postgres://soup:soup@postgres:5432/soup_test
      CGO_ENABLED: "0"
    volumes:
      - .:/src
      - gocache:/root/go
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  gocache:
